<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3eee6" />
<title>Birthday — Elegant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="css/style.css?v=1" />
</head>
<body>

<!-- Background audio (started inside the cover's Open gesture) -->
<audio id="bg-audio" loop preload="metadata"></audio>
<button id="music-toggle" class="music-btn" type="button" aria-label="Toggle music" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/>
    <path d="M15 9c1.5 1.5 1.5 4.5 0 6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </svg>
</button>

<!-- ============ COVER ============ -->
<section id="cover" class="cover">
  <div class="cover-content">
    <p class="cover-eyebrow" id="cover-eyebrow">A Birthday</p>

    <svg class="cover-emblem" viewBox="0 0 40 40" aria-hidden="true">
      <!-- Hair-thin diamond -->
      <path d="M20 4 L36 20 L20 36 L4 20 Z" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="20" cy="20" r="2" fill="currentColor"/>
    </svg>

    <h1 class="cover-name" id="cover-name">Name</h1>

    <p class="cover-date" id="cover-date">— — —</p>

    <button id="open-btn" class="cover-cta" type="button">
      <span>Open invitation</span>
      <span class="arrow" aria-hidden="true">→</span>
    </button>
  </div>
</section>

<!-- ============ INVITATION (revealed after Open) ============ -->
<main id="invitation" aria-hidden="true">

  <!-- Tribute (letter) -->
  <section class="section tribute" id="tribute" aria-labelledby="tribute-title">
    <p class="eyebrow">A Tribute</p>
    <h2 class="section-title visually-hidden" id="tribute-title">A tribute</h2>

    <blockquote class="letter-ar" id="letter-ar" dir="rtl"></blockquote>
    <div class="rule" aria-hidden="true" id="letter-rule"></div>
    <p class="letter-en" id="letter-en"></p>

    <div class="signature">
      <span class="signature-en" id="signature-en">With love</span>
      <span class="signature-ar" id="signature-ar"></span>
    </div>
  </section>

  <!-- Memories -->
  <section class="section memories" id="memories" aria-labelledby="memories-title" hidden>
    <p class="eyebrow">Moments</p>
    <h2 class="section-title" id="memories-title">A few moments</h2>
    <div class="memories-grid" id="memories-grid"></div>
  </section>

  <!-- Video -->
  <section class="section video-section" id="video-section" aria-labelledby="video-title" hidden>
    <p class="eyebrow">A Message</p>
    <h2 class="section-title" id="video-title">For you</h2>
    <div class="video-wrap" id="video-container"></div>
  </section>

  <footer class="footer">
    <p class="footer-mark">— with warmth —</p>
  </footer>
</main>

<script type="module" src="js/bootstrap.js?v=2"></script>
</body>
</html>
