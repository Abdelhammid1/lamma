<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — redirecting · لمة · LAMMA</title>
<link rel="icon" href="logo.jpg" type="image/jpeg" />
<!-- The old GitHub-based "Birthday Admin" lived here and only ever
     created birthdays — if a host tried to make a wedding here they'd
     end up with a birthday no matter what they typed. The real admin
     is now Flask-served at /admin and supports every template type
     (wedding, engagement, qiraya, sobou, birthday-elegant,
     wedding-noir). This file is a transition stub that forwards the
     browser straight there. If JS is off, the meta-refresh still goes.

     The Cloudflare _redirects /admin → /admin.html alias was removed
     at the same time, so on nginx production this file is never served
     (nginx proxies /admin to the Flask backend); it only kicks in on
     Cloudflare Pages, where it still correctly bounces to the real
     admin on the main host. -->
<!-- Prefer the current host (production nginx proxies /admin to Flask).
     Pages deployments without the backend fall back to the absolute
     production domain via the JS at the bottom. -->
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #fbf9f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #310b1e;
  }
  .card {
    max-width: 420px;
    padding: 32px 28px;
    text-align: center;
  }
  h1 { margin: 0 0 12px; font-size: 22px; font-weight: 600; }
  p  { margin: 0 0 20px; color: #504347; line-height: 1.55; font-size: 14px; }
  a.btn {
    display: inline-block;
    padding: 12px 24px;
    background: #4a2033;
    color: #ffdea4;
    text-decoration: none;
    border-radius: 8px;
    font-size: 13px;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  a.btn:hover { background: #310b1e; }
</style>
</head>
<body>
  <div class="card">
    <h1>Admin has moved</h1>
    <p>Taking you to the new admin — it supports every template (wedding, engagement, قراية فاتحة, سبوع, elegant birthday, wedding noir), not just birthdays.</p>
    <a class="btn" href="/admin/">Continue to admin →</a>
  </div>
  <script>
    (function () {
      // The real admin is the Flask app proxied at /admin on the
      // production host (lamma.manasety.ai). If we're on anything else
      // (a Cloudflare Pages preview, a staging host, a random mirror)
      // bounce to the absolute production domain so the user doesn't
      // get stuck looking at this transition card forever.
      var host = location.hostname;
      var isProdOrLocal =
        host === "lamma.manasety.ai" ||
        host === "localhost" || host === "127.0.0.1";
      var target = isProdOrLocal
        ? "/admin/"
        : "https://lamma.manasety.ai/admin/";
      // Also update the fallback button in case the JS replace is
      // blocked / slow / breaks (e.g. CSP), so the user still has a
      // one-click way out of the transition page.
      var btn = document.querySelector("a.btn");
      if (btn) btn.href = target;
      location.replace(target);
    })();
  </script>
</body>
</html>
