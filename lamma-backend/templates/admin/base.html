<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin · لمة · LAMMA{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('admin.static', filename='admin.css') }}">
</head>
<body>
{% if current_user.is_authenticated %}
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🌸</span>
    <span class="brand-name">لمة · LAMMA</span>
    <span class="brand-sub">Admin</span>
  </div>
  <nav>
    <a href="{{ url_for('admin.dashboard') }}" {% if request.endpoint == 'admin.dashboard' %}class="on"{% endif %}>Dashboard</a>
    <a href="{{ url_for('admin.events') }}" {% if request.endpoint == 'admin.events' %}class="on"{% endif %}>Events</a>
  </nav>
  <div class="who">
    <span>{{ current_user.email }}</span>
    <form action="{{ url_for('admin.logout') }}" method="post" style="display:inline">
      <button type="submit" class="btn btn-ghost">Sign out</button>
    </form>
  </div>
</header>
{% endif %}

<main class="shell">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>
</body>
</html>
