{% if brand and brand.show %}
<footer class="site-footer" style="width:100%;text-align:center;padding:14px 20px;margin-top:40px;border-top:1px solid rgba(0,0,0,0.08);font-size:12px;color:#6b6b6b;font-family:inherit;">
  <span>&copy; {{ now().year }} {{ app_name }} &mdash; {{ brand.text }}</span>
  <a href="{{ brand.url }}" target="_blank" rel="noopener noreferrer"
     style="font-weight:700;color:#4a1f2e;text-decoration:none;margin-left:4px;">{{ brand.name }}</a>
</footer>
{% endif %}
