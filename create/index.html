<!DOCTYPE html>

<head>

<title>Redirecting… — لمّة · LAMMA</title>

<script>
  (function () {
    var target = "/create.html" + (location.search || "") + (location.hash || "");

  })();
</script>
</head>
<body>
<p>Redirecting to <a id="link" href="/create.html">/create.html</a>…</p>

  document.getElementById("link").href = "/create.html" + (location.search || "") + (location.hash || "");
</script>
</body>
