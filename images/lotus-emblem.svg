<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="lotusGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EADBBA"/>
      <stop offset="50%" stop-color="#C9A86A"/>
      <stop offset="100%" stop-color="#A68042"/>
    </linearGradient>
    <linearGradient id="lotusBlush" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEEED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8B4B8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g transform="translate(100, 105)">
    <!-- Base petal leaves -->
    <path d="M -60 20 C -40 32, 40 32, 60 20 C 40 12, -40 12, -60 20 Z" fill="url(#lotusBlush)" stroke="url(#lotusGold)" stroke-width="1.2"/>
    <!-- Outer lateral petals -->
    <path d="M 0 15 C -30 10, -65 -10, -50 -35 C -35 -20, -15 -5, 0 15 Z" fill="url(#lotusBlush)" stroke="url(#lotusGold)" stroke-width="1.2"/>
    <path d="M 0 15 C 30 10, 65 -10, 50 -35 C 35 -20, 15 -5, 0 15 Z" fill="url(#lotusBlush)" stroke="url(#lotusGold)" stroke-width="1.2"/>
    <!-- Mid petals -->
    <path d="M 0 15 C -25 5, -45 -25, -28 -50 C -15 -30, -5 -5, 0 15 Z" fill="url(#lotusBlush)" stroke="url(#lotusGold)" stroke-width="1.2"/>
    <path d="M 0 15 C 25 5, 45 -25, 28 -50 C 15 -30, 5 -5, 0 15 Z" fill="url(#lotusBlush)" stroke="url(#lotusGold)" stroke-width="1.2"/>
    <!-- Central tall petal -->
    <path d="M 0 15 C -18 -15, -15 -55, 0 -68 C 15 -55, 18 -15, 0 15 Z" fill="#FFF9F7" stroke="url(#lotusGold)" stroke-width="1.4"/>
    <path d="M 0 10 L 0 -50" stroke="url(#lotusGold)" stroke-width="0.8" opacity="0.6"/>
    <!-- Central droplet bead -->
    <circle cx="0" cy="-73" r="2.2" fill="url(#lotusGold)"/>
    <circle cx="-12" cy="18" r="1.5" fill="url(#lotusGold)"/>
    <circle cx="12" cy="18" r="1.5" fill="url(#lotusGold)"/>
  </g>
</svg>
