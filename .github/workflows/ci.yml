# Runs on every push and pull request. A red run means: don't deploy.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lamma-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lamma-backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Site JavaScript parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Every module the site serves must at least parse — a syntax
      # error in one template file blanks that whole invitation.
      # Piped through stdin as a module on purpose: `node --check file.js`
      # silently passes a .js file that contains `import`.
      - name: every site .js file parses as a module
        run: |
          set -e
          git ls-files '*.js' | grep -v '/node_modules/' | while read -r f; do
            node --input-type=module --check < "$f" || { echo "::error file=$f::does not parse"; exit 1; }
          done
